name: Terraform GitOps Pipeline

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read
  pull-requests: write # Required to post plan output as a comment on PRs

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
          terraform_wrapper: false

      # Step 1: Run Terraform Plan on Pull Requests
      - name: Terraform Init, Validate & Plan
        if: github.event_name == 'pull_request'
        working-directory: ./terraform # Replace with your subfolder or remove if in root
        run: |
          terraform init
          terraform validate
          terraform plan -out=tfplan

      # Step 2: Run Terraform Apply ONLY when Merged to Main
      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ./terraform # Replace with your subfolder or remove if in root
        run: |
          terraform init
          terraform apply -auto-approve
